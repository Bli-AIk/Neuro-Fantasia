[package]
name = "neuro-fantasia"
version = "0.1.0"
edition = "2024"

[dependencies]
# Audio & DSP
fundsp = "0.18"
hound = "3.5"
rustfft = "6.2"

# Math & Parallelism
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
nalgebra = "0.33" # Useful helper for matrix math in analysis if needed, but std is often enough

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Utils
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.4"
once_cell = "1.19" # For global resource singleton
crossbeam-channel = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"